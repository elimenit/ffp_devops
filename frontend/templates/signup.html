{% extends 'base.html' %}

{% block title %}Registrate - Crear Cuenta{% endblock %}

{% block content %}
<h1>Prueba de FastApi con HTMX</h1>

<form hx-post="/auth/saludar" hx-target="#resultado" hx-swap="innerHTML">
    <label for="name">
        Nombre
    <input type="text" name="name" id="name">
    </label>
    <label for="email">
        Email
        <input type="email" name="email" id="email">
    </label>

    <label for="password">
        Password
        <input type="password" name="password" id="password">
    </label>

    <button type="submit">Enviar</button>
</form>

<div id="resultado" style="margin-top: 20pxd ;"></div>
{% endblock %}
